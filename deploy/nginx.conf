# Reverse proxy: the only entry point into the isolated "lab" network.
server {
    listen 8080;
    location / {
        proxy_pass http://webgoat:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

server {
    listen 9090;
    location / {
        proxy_pass http://webgoat:9090;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
